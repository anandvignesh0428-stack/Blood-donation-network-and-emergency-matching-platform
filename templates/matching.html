<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Matching Donors</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans Tamil', 'Latha', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            color: #1a1a2e;
        }

        .top-bar {
            background: linear-gradient(135deg, #b71c1c 0%, #c62828 50%, #d32f2f 100%);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 200;
            box-shadow: 0 2px 12px rgba(183,28,28,0.25);
        }
        .top-bar-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .top-bar-icon { width: 32px; height: 32px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .top-bar-title { color: white; font-size: 1rem; font-weight: 700; }
        .lang-toggle { display: flex; background: rgba(255,255,255,0.15); border-radius: 20px; padding: 2px; }
        .lang-btn { padding: 5px 14px; border: none; border-radius: 18px; font-size: 0.72rem; font-weight: 700; cursor: pointer; background: transparent; color: rgba(255,255,255,0.65); transition: all 0.2s; }
        .lang-btn.active { background: white; color: #b71c1c; }

        .container { max-width: 720px; margin: 0 auto; padding: 16px 16px 90px; }

        .page-title { font-size: 1.4rem; font-weight: 800; color: #1a1a2e; margin-bottom: 4px; }
        .page-subtitle { font-size: 0.85rem; color: #888; margin-bottom: 20px; }

        .card { background: white; border-radius: 16px; padding: 18px; margin-bottom: 12px; box-shadow: 0 1px 8px rgba(0,0,0,0.05); }

        .section-title { font-size: 0.78rem; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

        .request-card {
            background: #fafafa;
            border-radius: 14px;
            padding: 18px;
            border-left: 4px solid #b71c1c;
            margin-bottom: 12px;
        }
        .request-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .request-id { font-size: 0.95rem; font-weight: 700; color: #b71c1c; }
        .request-priority { display: inline-flex; padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; }
        .request-priority.critical { background: #ffebee; color: #c62828; }
        .request-priority.high { background: #fff3e0; color: #e65100; }
        .request-priority.normal { background: #e8f5e9; color: #2e7d32; }
        .request-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .req-detail { font-size: 0.82rem; color: #555; }
        .req-detail strong { color: #333; }
        .req-detail.span2 { grid-column: span 2; }
        .find-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #b71c1c, #d32f2f);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
            min-height: 44px;
        }
        .find-btn:hover { box-shadow: 0 3px 12px rgba(183,28,28,0.3); }
        .find-btn:active { transform: scale(0.98); }

        .results-area { margin-top: 12px; }

        .donor-result {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: #fafafa;
            border-radius: 12px;
            margin-bottom: 8px;
            border-left: 3px solid #4caf50;
        }
        .donor-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #e8f5e9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .donor-info { flex: 1; min-width: 0; }
        .donor-name { font-size: 0.92rem; font-weight: 700; color: #1a1a2e; }
        .donor-blood { font-size: 0.78rem; color: #b71c1c; font-weight: 600; }
        .donor-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .donor-tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 3px 8px;
            background: #f0f0f0;
            border-radius: 6px;
            font-size: 0.7rem;
            color: #666;
            font-weight: 500;
        }
        .donor-tag.distance { background: #e3f2fd; color: #1565c0; font-weight: 700; }
        .donor-call {
            padding: 10px 16px;
            background: linear-gradient(135deg, #43a047, #2e7d32);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 40px;
            flex-shrink: 0;
            transition: transform 0.15s;
        }
        .donor-call:active { transform: scale(0.97); }

        .empty-state { text-align: center; padding: 28px 16px; color: #999; }
        .empty-state-icon { font-size: 2.2rem; margin-bottom: 8px; }
        .empty-state-text { font-size: 0.9rem; font-weight: 600; }
        .empty-state-sub { font-size: 0.78rem; color: #bbb; margin-top: 4px; }

        .loading { text-align: center; padding: 20px; color: #999; font-weight: 500; }
        .spinner { width: 24px; height: 24px; border: 3px solid #eee; border-top-color: #b71c1c; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 16px auto;
            color: #b71c1c;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            padding: 10px;
            border-radius: 10px;
            max-width: 720px;
        }
        .back-link:hover { background: #ffebee; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            box-shadow: 0 -2px 16px rgba(0,0,0,0.08);
            display: flex;
            z-index: 200;
            padding-bottom: env(safe-area-inset-bottom);
            border-top: 1px solid #f0f0f0;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 0 6px;
            text-decoration: none;
            color: #999;
            font-size: 0.65rem;
            font-weight: 600;
            gap: 3px;
            transition: color 0.2s;
            position: relative;
        }
        .nav-item.active { color: #b71c1c; }
        .nav-item.active::before { content: ''; position: absolute; top: 0; width: 24px; height: 3px; background: #b71c1c; border-radius: 0 0 3px 3px; }
        .nav-icon { font-size: 1.25rem; line-height: 1; }

        .nearby-card { text-align: center; }
        .nearby-btn {
            width: 100%;
            padding: 14px 18px;
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 2px 8px rgba(13,71,161,0.2);
        }
        .nearby-btn:hover { box-shadow: 0 4px 16px rgba(13,71,161,0.3); transform: translateY(-1px); }
        .nearby-btn:active { transform: scale(0.98); }
        .nearby-btn:disabled { background: #bbb; box-shadow: none; cursor: not-allowed; transform: none; }
        .nearby-status { margin-top: 10px; font-size: 0.82rem; font-weight: 600; min-height: 18px; }
        .nearby-status.error { color: #c62828; }
        .nearby-status.success { color: #2e7d32; }
        .banks-results { margin-top: 12px; }
        .bank-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            background: #fafafa;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #0d47a1;
        }
        .bank-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
        .bank-name { font-size: 0.92rem; font-weight: 700; color: #1a1a2e; flex: 1; }
        .bank-address { font-size: 0.82rem; color: #666; line-height: 1.4; }
        .bank-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .bank-tag { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; background: #f0f0f0; border-radius: 6px; font-size: 0.7rem; color: #666; font-weight: 500; }
        .bank-tag.distance { background: #e3f2fd; color: #1565c0; font-weight: 700; }
        .bank-tag.coords { background: #e8f5e9; color: #2e7d32; }
        .bank-open-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.15s;
            min-height: 40px;
            align-self: flex-start;
        }
        .bank-open-btn:hover { box-shadow: 0 3px 12px rgba(13,71,161,0.3); }
        .bank-open-btn:active { transform: scale(0.97); }
        .banks-title { font-size: 0.82rem; font-weight: 700; color: #0d47a1; margin-bottom: 8px; }

        @media (max-width: 480px) {
            .request-details { grid-template-columns: 1fr; }
            .req-detail.span2 { grid-column: span 1; }
        }
        @media (min-width: 768px) {
            .container { max-width: 640px; padding: 20px 24px 90px; }
        }
    </style>
</head>

        bankNameDefault: '\u0B87\u0BB0\u0BA4\u0BCD\u0BA4 \u0BB5\u0B99\u0BCD\u0B95\u0BBF',
        addressNotAvailable: '\u0BAE\u0BC1\u0B95\u0BB5\u0BB0\u0BBF \u0B95\u0BBF\u0B9F\u0BC8\u0B95\u0BCD\u0B95\u0BB5\u0BBF\u0BB2\u0BCD\u0BB2\u0BC8',

    }

function setLang(lang) {
    curLang = lang;
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langTa').classList.toggle('active', lang === 'ta');
    applyLang();
    loadRequests();
}

function applyLang() {
    var t = T[curLang];
    document.getElementById('pageTitle').textContent = t.pageTitle;
    document.getElementById('pageSub').textContent = t.pageSub;
    document.getElementById('backLink').textContent = t.backLink;
    document.getElementById('bnHome').textContent = t.bnHome;
    document.getElementById('bnEmg').textContent = t.bnEmg;
    document.getElementById('bnDonor').textContent = t.bnDonor;
    document.getElementById('bnFind').textContent = t.bnFind;
    document.getElementById('bnDash').textContent = t.bnDash;
    var nearbyBtn = document.getElementById('nearbyBtn');
    if (nearbyBtn && !nearbyBtn.disabled) nearbyBtn.textContent = t.findNearbyBtn;
}

var banksCache = {};
var banksCacheTime = {};
var isFetchingBanks = false;

function haversineBanks(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
function formatBankAddress(tags) {
    if (!tags) return '';
    if (tags['addr:full']) return tags['addr:full'];
    var parts = [];
    if (tags['addr:street']) parts.push(tags['addr:street']);
    if (tags['addr:housenumber']) parts.push(tags['addr:housenumber']);
    if (tags['addr:city']) parts.push(tags['addr:city']);
    if (tags['addr:postcode']) parts.push(tags['addr:postcode']);
    if (tags['addr:state']) parts.push(tags['addr:state']);
    return parts.join(', ');
}
function openBankInMaps(lat, lng) {
    var url = 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng;
    window.open(url, '_blank');
}
function renderBanks(banks, userLat, userLng) {
    var t = T[curLang];
    var container = document.getElementById('banksResults');
    container.innerHTML = '';
    if (!banks || banks.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">\uD83C\uDFE5</div><div class="empty-state-text">' + t.noBanks + '</div><div class="empty-state-sub">' + t.noBanksSub + '</div></div>';
        return;
    }
    var title = document.createElement('div');
    title.className = 'banks-title';
    title.textContent = t.banksTitle + ' (' + banks.length + ')';
    container.appendChild(title);
    banks.forEach(function(b) {
        var card = document.createElement('div');
        card.className = 'bank-card';
        var name = b.name ? escapeHtml(b.name) : t.bankNameDefault;
        var addr = b.address ? escapeHtml(b.address) : t.addressNotAvailable;
        var dist = b.distanceKm !== null ? b.distanceKm.toFixed(1) + ' ' + t.km : '';
        card.innerHTML =
            '<div class="bank-header"><div class="bank-name">\uD83C\uDFE5 ' + name + '</div></div>' +
            '<div class="bank-address">' + addr + '</div>' +
            '<div class="bank-meta">' +
                (dist ? '<span class="bank-tag distance">\uD83D\uDCCD ' + dist + ' ' + t.away + '</span>' : '') +
                '<span class="bank-tag coords">' + b.lat.toFixed(5) + ', ' + b.lon.toFixed(5) + '</span>' +
            '</div>' +
            '<a class="bank-open-btn" href="#" onclick="openBankInMaps(' + b.lat + ',' + b.lon + '); return false;">\uD83D\uDCCD ' + t.openInMaps + '</a>';
        container.appendChild(card);
    });
}
function findNearbyBanks() {
    var t = T[curLang];
    var btn = document.getElementById('nearbyBtn');
    var status = document.getElementById('nearbyStatus');
    var results = document.getElementById('banksResults');
    if (isFetchingBanks) return;
    if (!navigator.geolocation) {
        status.textContent = t.gpsNotSupported;
        status.className = 'nearby-status error';
        return;
    }
    btn.disabled = true;
    btn.textContent = t.locating;
    status.textContent = t.locating;
    status.className = 'nearby-status';
    results.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:8px">' + t.searchingBanks + '</p></div>';
    navigator.geolocation.getCurrentPosition(
        function(pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            var cacheKey = lat.toFixed(3) + ',' + lng.toFixed(3);
            var now = Date.now();
            if (banksCache[cacheKey] && (now - banksCacheTime[cacheKey] < 300000)) {
                var cached = banksCache[cacheKey];
                status.textContent = '';
                status.className = 'nearby-status';
                btn.disabled = false;
                btn.textContent = t.findNearbyBtn;
                renderBanks(cached, lat, lng);
                return;
            }
            var query = '[out:json][timeout:25];(nwr["healthcare"="blood_bank"](around:10000,' + lat + ',' + lng + ');nwr["healthcare"="blood_donation"](around:10000,' + lat + ',' + lng + '););out center 20;';
            var url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
            isFetchingBanks = true;
            status.textContent = t.searchingBanks;
            fetch(url)
                .then(function(resp) {
                    if (!resp.ok) throw new Error('Overpass error ' + resp.status);
                    return resp.json();
                })
                .then(function(data) {
                    var elements = data.elements || [];
                    var banks = [];
                    elements.forEach(function(el) {
                        var bLat = el.lat || (el.center && el.center.lat);
                        var bLon = el.lon || (el.center && el.center.lon);
                        if (bLat == null || bLon == null) return;
                        var tags = el.tags || {};
                        var name = tags.name || tags['operator'] || '';
                        var address = formatBankAddress(tags);
                        var dist = haversineBanks(lat, lng, bLat, bLon);
                        banks.push({ name: name, address: address, lat: bLat, lon: bLon, distanceKm: dist });
                    });
                    banks.sort(function(a,b){ return a.distanceKm - b.distanceKm; });
                    banksCache[cacheKey] = banks;
                    banksCacheTime[cacheKey] = now;
                    status.textContent = '';
                    status.className = 'nearby-status';
                    renderBanks(banks, lat, lng);
                })
                .catch(function(err) {
                    status.textContent = t.overpassError;
                    status.className = 'nearby-status error';
                    results.innerHTML = '<div class="empty-state"><div class="empty-state-icon">\u26A0\uFE0F</div><div class="empty-state-text">' + t.overpassError + '</div></div>';
                })
                .finally(function(){
                    isFetchingBanks = false;
                    btn.disabled = false;
                    btn.textContent = t.findNearbyBtn;
                });
        },
        function(err) {
            var msg = '';
            switch(err.code) {
                case 1: msg = t.gpsPermDenied; break;
                case 2: msg = t.gpsUnavailable; break;
                case 3: msg = t.gpsTimeout; break;
                default: msg = t.gpsDefault;
            }
            status.textContent = msg;
            status.className = 'nearby-status error';
            results.innerHTML = '';
            btn.disabled = false;
            btn.textContent = t.findNearbyBtn;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
}

async function loadRequests() {
    var t = T[curLang];
    try {
        var resp = await fetch('/emergency-requests');
        var requests = await resp.json();
        var container = document.getElementById('requests');
        container.innerHTML = '';

        if (requests.length === 0) {
            container.innerHTML = '<div class="card"><div class="empty-state"><div class="empty-state-icon">&#128680;</div><div class="empty-state-text">' + t.noRequests + '</div></div></div>';
            return;
        }

        requests.forEach(function(req) {
            var card = document.createElement('div');
            card.className = 'card';
            var priorityClass = (req.priority || 'normal').toLowerCase();
            var priorityLabel = req.priority || 'Normal';
            card.innerHTML =
                '<div class="request-card">' +
                    '<div class="request-header">' +
                        '<span class="request-id">' + t.reqPrefix + '#' + req.id + '</span>' +
                        '<span class="request-priority ' + priorityClass + '">' + priorityLabel + '</span>' +
                    '</div>' +
                    '<div class="request-details">' +
                        '<div class="req-detail"><strong>' + t.patient + ':</strong> ' + req.patient_name + '</div>' +
                        '<div class="req-detail"><strong>' + t.blood + ':</strong> ' + req.blood_group + '</div>' +
                        '<div class="req-detail"><strong>' + t.loc + ':</strong> ' + req.location + '</div>' +
                        '<div class="req-detail"><strong>' + t.hosp + ':</strong> ' + req.hospital + '</div>' +
                        '<div class="req-detail span2"><strong>' + t.contact + ':</strong> ' + req.contact + '</div>' +
                    '</div>' +
                    '<button class="find-btn" onclick="findDonors(' + req.id + ', this)">' + t.findBtn + '</button>' +
                '</div>' +
                '<div class="results-area" id="results-' + req.id + '"></div>';
            container.appendChild(card);
        });
    } catch(err) {
        document.getElementById('requests').innerHTML = '<div class="card"><div class="empty-state"><div class="empty-state-text">' + t.unableLoad + '</div></div></div>';
    }
}

async function findDonors(requestId, btn) {
    var t = T[curLang];
    var results = document.getElementById('results-' + requestId);
    btn.disabled = true;
    btn.textContent = t.searching;
    results.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

    try {
        var resp = await fetch('/match/' + requestId);
        var data = await resp.json();

        if (!data.matched_donors || data.matched_donors.length === 0) {
            results.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#128269;</div><div class="empty-state-text">' + t.noMatch + '</div><div class="empty-state-sub">' + t.noMatchSub + '</div></div>';
            btn.disabled = false;
            btn.textContent = t.findBtn;
            return;
        }

        var html = '<div class="section-title">' + t.matchingDonors + ' (' + data.matched_donors.length + ')</div>';
        data.matched_donors.forEach(function(donor) {
            var phoneDigits = (donor.phone || '').replace(/[^0-9]/g, '');
            var callLink = phoneDigits.length >= 10 ? '<a href="tel:' + phoneDigits + '" class="donor-call">&#128222; ' + t.callBtn + '</a>' : '';
            var distText = '';
            if (donor.distance_km !== null && donor.distance_km !== undefined) {
                if (donor.distance_km < 9999) {
                    distText = '<span class="donor-tag distance">&#128205; ' + donor.distance_km + ' ' + t.km + ' ' + t.away + '</span>';
                }
            }
            html +=
                '<div class="donor-result">' +
                    '<div class="donor-avatar">&#128100;</div>' +
                    '<div class="donor-info">' +
                        '<div class="donor-name">' + donor.name + '</div>' +
                        '<div class="donor-blood">' + donor.blood_group + '</div>' +
                        '<div class="donor-meta">' +
                            '<span class="donor-tag">&#128205; ' + donor.location + '</span>' +
                            distText +
                            '<span class="donor-tag">&#9989; ' + t.available + '</span>' +
                        '</div>' +
                    '</div>' +
                    callLink +
                '</div>';
        });
        results.innerHTML = html;
        btn.disabled = false;
        btn.textContent = t.findBtn;
    } catch(err) {
        results.innerHTML = '<div class="empty-state"><div class="empty-state-text">' + t.errorFinding + '</div></div>';
        btn.disabled = false;
        btn.textContent = t.findBtn;
    }
}

applyLang();
loadRequests();
</script>
